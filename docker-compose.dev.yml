# Development-only: Expo Go + Cloudflare Tunnel
# Usage: docker compose -f docker-compose.dev.yml up
#
# Prerequisites:
#   1. Create a Cloudflare Tunnel at https://one.dash.cloudflare.com
#   2. Set TUNNEL_TOKEN in .env or export it
#   3. Run: docker compose -f docker-compose.dev.yml up

services:
  expo:
    build:
      context: .
      dockerfile: Dockerfile.expo
    container_name: localplug-expo
    ports:
      - "8099:8099"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=expo
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8099"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dev-network

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: localplug-tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    env_file:
      - .env
    depends_on:
      expo:
        condition: service_healthy
    # NO network_mode: host — uses Docker internal network so it can reach expo:8099
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge
