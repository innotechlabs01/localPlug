version: '3.8'

services:
  localplug:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localplug-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - TZ=America/Bogota
      # Point to n8n in Docker network
      - N8N_BASE_URL=http://n8n:5678
      # Point to Ollama in Docker network (fallback when n8n unavailable)
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - localplug-network

  ollama:
    image: ollama/ollama:latest
    container_name: localplug-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - localplug-network

  n8n:
    image: n8nio/n8n:latest
    container_name: localplug-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env.local
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/opt/n8n/workflows
      - ./n8n/docker-entrypoint.sh:/docker-entrypoint.sh
    environment:
      - N8N_ENCRYPTION_KEY=localplug-n8n-encryption-key-2026
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localplug:3000
      - NODE_ENV=production
      - TZ=America/Bogota
      - OLLAMA_MODEL=llama3.1:8b
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - N8N_USER_MANAGEMENT_DISABLED=true
      - N8N_METRICS=false
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - localplug-network

  ollama-setup:
    image: ollama/ollama:latest
    container_name: localplug-ollama-setup
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        echo "Waiting for Ollama server..."
        sleep 10
        echo "Pulling model: ${OLLAMA_MODEL:-llama3.1:8b}"
        ollama pull ${OLLAMA_MODEL:-llama3.1:8b}
        echo "Model ready!"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - localplug-network

volumes:
  ollama-data:
  n8n-data:

networks:
  localplug-network:
    driver: bridge
