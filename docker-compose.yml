version: '3.8'

services:
  localplug:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localplug-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - TZ=America/Bogota
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - localplug-network

networks:
  localplug-network:
    driver: bridge
